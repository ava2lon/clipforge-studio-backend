name: Test public YouTube Shorts ingestion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/social-url-smoke.yml"
      - "renderer/ingestion.py"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  youtube-shorts-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install yt-dlp
        run: python -m pip install --upgrade "yt-dlp>=2025.11.12,<2027"
      - name: Download supplied public Shorts URL without cookies
        env:
          TEST_VIDEO_URL: https://youtube.com/shorts/_az0sT5IYaE?si=RGARmBuPzvmIVrz3
        run: |
          yt-dlp --ignore-config --no-playlist --no-cache-dir --no-warnings \
            --socket-timeout 30 --retries 2 --fragment-retries 2 \
            --max-filesize 100M --format "best[ext=mp4]/best" \
            --remux-video mp4 --output "/tmp/clipforge-youtube-test.%(ext)s" \
            "$TEST_VIDEO_URL"
          test -s /tmp/clipforge-youtube-test.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 /tmp/clipforge-youtube-test.mp4
