name: Sync Hugging Face Space to GitHub

on:
  workflow_dispatch:
    inputs:
      confirm_sync:
        description: "Confirm mirroring the Hugging Face Space into this repository"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hf-space-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Clone and sync Ava2lon/studio
    if: inputs.confirm_sync == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Git LFS
        run: |
          git lfs install --local
          git lfs version

      - name: Clone Hugging Face Space and hydrate every LFS object
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::HF_TOKEN secret is missing or empty."
            exit 1
          fi

          auth_header="Basic $(printf 'Ava2lon:%s' "$HF_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://huggingface.co/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: $auth_header"

          # Skip automatic smudge so the clone phase is deterministic.
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 \
            https://huggingface.co/spaces/Ava2lon/studio \
            "$RUNNER_TEMP/hf-studio"

          cd "$RUNNER_TEMP/hf-studio"
          git lfs install --local
          git lfs fetch --all origin
          git lfs checkout

          echo "Checking all LFS pointers against hydrated local objects..."
          git lfs fsck
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          unset auth_header

          # Fail if any tracked LFS path still contains a pointer instead of its payload.
          while IFS= read -r -d '' file; do
            if head -c 200 "$file" | grep -aq '^version https://git-lfs.github.com/spec/v1'; then
              echo "::error::LFS pointer was not hydrated: $file"
              exit 1
            fi
          done < <(git ls-files -z)

      - name: Sync Space files into backend repository
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$RUNNER_TEMP/hf-studio/"
          target_dir="$GITHUB_WORKSPACE/"

          # Preserve this repository's Git metadata and GitHub Actions workflows.
          # Exclude environment files, local credentials, and known cookie storage.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='**/.env' \
            --exclude='**/.env.*' \
            --exclude='**/cookies/' \
            --exclude='**/cookies/**' \
            --exclude='*.pem' \
            --exclude='*.key' \
            "$source_dir" "$target_dir"

      - name: Commit and push synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Sync backend from Hugging Face Space"
          git push origin HEAD:main

      - name: Report Git LFS inventory
        if: always()
        run: |
          if git lfs version >/dev/null 2>&1; then
            git lfs ls-files || true
          fi
