name: Verify deployed ClipForge Space

on:
  workflow_run:
    workflows: ["Deploy ClipForge Backend to Hugging Face"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipforge-space-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Space health endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://ava2lon-studio.hf.space"
          deadline=$((SECONDS + 720))
          until [ "$SECONDS" -ge "$deadline" ]; do
            status="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' --max-time 20 "$BASE_URL/health" || true)"
            if [ "$status" = "200" ] && python -c 'import json; d=json.load(open("/tmp/health.json")); assert d.get("status") == "ok"; print(d)' ; then
              echo "Space health endpoint is ready."
              exit 0
            fi
            echo "Space not ready yet (HTTP ${status:-no response}); retrying in 15 seconds."
            sleep 15
          done
          echo "Space did not become healthy within 12 minutes."
          [ ! -f /tmp/health.json ] || cat /tmp/health.json
          exit 1

      - name: Verify required runtime capabilities
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 \
            "https://ava2lon-studio.hf.space/capabilities" -o /tmp/capabilities.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/capabilities.json").read_text())
          required = {
              "ffmpeg": data.get("ffmpeg", {}).get("available"),
              "ffprobe": data.get("ffprobe", {}).get("available"),
              "auto_editor": data.get("auto_editor", {}).get("available"),
              "remotion": data.get("remotion", {}).get("available"),
              "whisperx": data.get("python_modules", {}).get("whisperx"),
              "pyscenedetect": data.get("python_modules", {}).get("pyscenedetect"),
          }
          storage = data.get("storage")
          print(json.dumps({"required": required, "storage": storage}, indent=2))
          missing = [name for name, available in required.items() if available is not True]
          if missing:
              raise SystemExit("Missing required runtime capabilities: " + ", ".join(missing))
          if not isinstance(storage, dict):
              raise SystemExit("Storage diagnostics are missing from the deployed runtime.")
          storage_fields = (
              "workdir_mountpoint_detected",
              "database_parent_mountpoint_detected",
              "workdir_and_database_same_filesystem",
          )
          invalid_storage = [name for name in storage_fields if not isinstance(storage.get(name), bool)]
          if invalid_storage:
              raise SystemExit("Invalid storage diagnostics: " + ", ".join(invalid_storage))
          PY

      - name: Verify authenticated runtime metrics
        shell: bash
        env:
          STUDIO_API_KEY: ${{ secrets.AVA2LON_STUDIO_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STUDIO_API_KEY}" ]; then
            status="$(curl --silent --show-error --output /tmp/metrics.json --write-out '%{http_code}' --max-time 30 \
              "https://ava2lon-studio.hf.space/metrics")"
            if [ "${status}" != "401" ]; then
              echo "Unauthenticated metrics request should return HTTP 401, received ${status}."
              cat /tmp/metrics.json
              exit 1
            fi
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/metrics.json").read_text())
          assert data.get("detail") == "Unauthorized", data
          print("Metrics endpoint correctly rejects unauthenticated requests.")
          PY
            exit 0
          fi
          status="$(curl --silent --show-error --output /tmp/metrics.json --write-out '%{http_code}' --max-time 30 \
            -H "X-API-Key: ${STUDIO_API_KEY}" "https://ava2lon-studio.hf.space/metrics")"
          if [ "${status}" != "200" ]; then
            echo "Metrics endpoint returned HTTP ${status}."
            cat /tmp/metrics.json
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/metrics.json").read_text())
          assert isinstance(data.get("jobs_by_state"), dict)
          queue = data.get("queue", {})
          storage = data.get("storage", {})
          assert isinstance(queue.get("active_jobs"), int)
          assert isinstance(queue.get("active_edit_renders"), int)
          assert isinstance(queue.get("max_active_jobs"), int)
          assert isinstance(storage.get("free_bytes"), int)
          assert isinstance(storage.get("retention_seconds"), int)
          print(json.dumps({
              "jobs_by_state": data["jobs_by_state"],
              "queue": queue,
              "free_storage_bytes": storage["free_bytes"],
          }, indent=2))
          PY
