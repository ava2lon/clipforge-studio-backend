name: Reconcile ClipForge Usage

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipforge-usage-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reconcile terminal Studio jobs and release or settle quota
        env:
          RECONCILE_SECRET: ${{ secrets.AVA2LON_STUDIO_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RECONCILE_SECRET}" ]; then
            echo "::error::AVA2LON_STUDIO_API_KEY GitHub Actions secret is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --retry-all-errors --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${RECONCILE_SECRET}" \
            -H "Accept: application/json" \
            https://clipforge-seven-tau.vercel.app/api/cron/reconcile-usage
