name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<1" "pydantic>=2.8,<3" "httpx>=0.27,<1" "pytest>=8,<9"
      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install --no-audit --no-fund
      - name: Ensure Remotion browser
        working-directory: remotion
        run: npx remotion browser ensure
      - name: Validate Remotion composition
        working-directory: remotion
        run: npx remotion bundle src/index.ts --out-dir=build --log=error
      - name: Run tests
        run: pytest -q
